name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same checks as the local pre-commit hooks: file hygiene, ruff, mypy per service.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin the exact version
      - run: uv sync --locked
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test-api:
    runs-on: ubuntu-latest
    # A Postgres container next to the job, like the `db` service in docker-compose.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: jobhunt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin the exact version
      - run: uv sync --locked
      - run: uv run pytest -v
        working-directory: backend/api

  test-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin the exact version
      - run: uv sync --locked
      - run: uv run pytest -v
        working-directory: backend/scraper

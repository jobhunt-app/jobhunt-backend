# Workspace root. It has no [project] table on purpose: it is a "virtual" root that only
# groups the services, holds shared dev tools, and configures ruff/mypy for all of them.
# Each service declares its own runtime dependencies in its own pyproject.toml.

[tool.uv.workspace]
members = ["backend/api", "backend/scraper"]

# Dev-only tools shared by every member. `uv sync` installs these by default.
[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# One-off generator for the GitHub board (already run); mostly long data strings.
extend-exclude = ["scripts/github_setup.py"]
# Apply the exclude even when a tool (pre-commit) passes file names explicitly.
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors and warnings
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # isort: import sorting
    "UP",       # pyupgrade: use modern Python syntax (e.g. `list[str]`, `X | None`)
    "B",        # flake8-bugbear: likely bugs (mutable default args, etc.)
    "SIM",      # flake8-simplify: simpler equivalent code
    "ASYNC",    # flake8-async: blocking calls inside `async def`
    "RUF",      # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
